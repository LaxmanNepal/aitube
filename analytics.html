<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Growth Lab — AI Tube</title><style>:root{--bg:#f6f8fc;--p:#fff;--p2:#f0f3f7;--line:#dfe5ed;--text:#111827;--muted:#657184;--accent:#111827}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#e7f0ff,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1280px,92vw);margin:auto}header{position:sticky;top:0;background:#ffffffdd;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:4}.nav{height:68px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:-.04em}.brand small{display:block;font-size:9px;color:#778196;letter-spacing:.15em}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 13px;text-decoration:none;cursor:pointer}.btn:hover,.range.active{background:#111827;color:#fff}.hero{padding:55px 0 25px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#748095}.hero h1{font-size:clamp(44px,7vw,78px);letter-spacing:-.06em;line-height:.95;margin:12px 0}.hero p{max-width:780px;color:var(--muted);font-size:17px;line-height:1.6}.status{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:15px}.ok{color:#18864b}.warn{color:#a56a00}.ranges{display:flex;gap:7px;margin:15px 0;overflow:auto}.range{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 38px #17203310}.channel{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:15px;object-fit:cover;background:var(--p2)}h2{font-size:23px;margin:5px 0}.handle{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.stat{background:var(--p2);border-radius:11px;padding:10px}.num{font-weight:850;font-size:19px}.label{font-size:9px;color:#748095;letter-spacing:.1em;margin-top:3px}.chart{height:260px;margin-top:15px}.chart svg{width:100%;height:100%;overflow:visible}.gridline{stroke:#dfe5ed;stroke-width:1}.line{fill:none;stroke:#111827;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111827}.delta{font-size:13px;color:#18864b;font-weight:750}.muted{color:var(--muted);font-size:12px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cbd3de;border-radius:18px}@media(max-width:650px){.hero{padding-top:38px}.chart{height:210px}.stats{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><div class="wrap nav"><div class="brand">AI TUBE<small>GROWTH LAB • 24H / 7D / 30D</small></div><div><a class="btn" href="my-channels.html">← My Channels</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Historical creator analytics</div><h1>Growth Lab.</h1><p>See how your channels and tracked competitors change over time. The dashboard calculates deltas from the hourly snapshots saved by GitHub Actions.</p><div class="status"><span id="health" class="warn">● Loading history…</span><span id="updated" class="muted">—</span></div><div class="ranges"><button class="range active" data-hours="24">24H</button><button class="range" data-hours="168">7D</button><button class="range" data-hours="720">30D</button></div></section><section id="content" class="cards"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>n==null?'—':(n=Number(n),n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n)));let history=null,hours=24;function pointsFor(id,key){let a=(history?.snapshots||[]).filter(s=>s.capturedAt).slice(-hours);return a.map(s=>{let c=(s.owned||[]).find(x=>x.id===id);return c?Number(c[key]||0):null}).filter(x=>x!=null)}function path(a,w=700,h=220){if(!a.length)return '';let min=Math.min(...a),max=Math.max(...a),range=max-min||1;let pts=a.map((v,i)=>{let x=20+(i/(Math.max(a.length-1,1)))*(w-40),y=15+(1-(v-min)/range)*(h-35);return [x,y]});let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');let dots=pts.map(p=>'<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.8"/>').join('');return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line class="gridline" x1="20" y1="15" x2="'+(w-20)+'" y2="15"/><line class="gridline" x1="20" y1="110" x2="'+(w-20)+'" y2="110"/><line class="gridline" x1="20" y1="200" x2="'+(w-20)+'" y2="200"/><path class="line" d="'+d+'"/>'+dots+'</svg>'}function delta(a){if(a.length<2)return 'Waiting for more snapshots';let first=a[0],last=a[a.length-1],diff=last-first,p=first?diff/first*100:0;return (diff>=0?'+':'')+fmt(diff)+' ('+(p>=0?'+':'')+p.toFixed(1)+'%)'}function render(){let own=(history?.snapshots||[]).flatMap(s=>s.owned||[]);let map=new Map();own.forEach(c=>{if(c.id&&!map.has(c.id))map.set(c.id,c)});if(!map.size){document.getElementById('content').innerHTML='<div class="empty">No owned-channel history yet. Once the hourly workflows run, 24H / 7D / 30D growth will appear here.</div>';return}document.getElementById('content').innerHTML=[...map.values()].map((c,i)=>{let sub=pointsFor(c.id,'subscribers'),views=pointsFor(c.id,'views'),vids=pointsFor(c.id,'videos');return '<article class="card"><div class="channel"><img class="avatar" src="'+esc(c.thumbnail||'')+'" onerror="this.style.visibility=\'hidden\'" alt=""><div><div class="eyebrow">OWN CHANNEL 0'+(i+1)+'</div><h2>'+esc(c.title)+'</h2><div class="handle">'+esc(c.handle)+'</div></div></div><div class="stats"><div class="stat"><div class="num">'+fmt(sub.at(-1))+'</div><div class="label">SUBSCRIBERS</div></div><div class="stat"><div class="num">'+fmt(views.at(-1))+'</div><div class="label">TOTAL VIEWS</div></div><div class="stat"><div class="num">'+fmt(vids.at(-1))+'</div><div class="label">VIDEOS</div></div></div><div class="chart">'+path(sub)+'</div><div class="delta">Subscriber change: '+delta(sub)+'</div><p class="muted">View change: '+delta(views)+' • Video count change: '+delta(vids)+'</p></article>'}).join('')}async function load(){try{let r=await fetch('data/history.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('History snapshot unavailable');history=await r.json();document.getElementById('health').textContent='● HISTORY LOADED';document.getElementById('health').className='ok';document.getElementById('updated').textContent=history.updatedAt?'Updated '+new Date(history.updatedAt).toLocaleString():'Waiting for first snapshot';render()}catch(e){document.getElementById('health').textContent='● '+e.message;render()}}document.querySelectorAll('.range').forEach(b=>b.onclick=()=>{document.querySelectorAll('.range').forEach(x=>x.classList.remove('active'));b.classList.add('active');hours=Number(b.dataset.hours);render()});load();setInterval(load,300000);</script></body></html>
