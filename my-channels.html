<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>My Channels — AI Tube</title><style>:root{--bg:#f6f8fc;--p:#fff;--p2:#f0f3f7;--line:#dfe5ed;--text:#111827;--muted:#657184;--shadow:0 12px 38px #17203310}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#e7f0ff,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}.wrap{width:min(1280px,92vw);margin:auto}header{position:sticky;top:0;background:#ffffffdb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:5}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:-.04em}.brand small{display:block;font-size:9px;color:#778196;letter-spacing:.15em}.actions{display:flex;gap:7px;overflow:auto}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;color:var(--text);text-decoration:none;cursor:pointer;white-space:nowrap}.btn.active,.btn:hover{background:#111827;color:#fff;border-color:#111827}.hero{padding:55px 0 25px}.eyebrow,.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#748095}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-.06em;margin:12px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:800px}.status{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:15px}.ok{color:#18864b}.warn{color:#a56a00}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.channel{display:flex;gap:14px;align-items:center}.avatar{width:70px;height:70px;border-radius:18px;object-fit:cover;background:var(--p2)}h2{margin:8px 0 3px;font-size:24px}.handle{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:18px}.stat{background:var(--p2);border-radius:12px;padding:11px}.num{font-weight:850;font-size:20px}.label{font-size:9px;margin-top:3px}.section{padding:10px 0 65px}.video{display:grid;grid-template-columns:180px 1fr;gap:15px;align-items:start}.thumb{width:180px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--p2)}.video h3{margin:5px 0;font-size:17px}.meta{font-size:12px;color:var(--muted);line-height:1.6}.pill{display:inline-block;padding:5px 8px;border-radius:99px;background:var(--p2);font-size:10px;margin:3px 3px 0 0}.empty{padding:25px;color:var(--muted);text-align:center;border:1px dashed #cbd3de;border-radius:18px}@media(max-width:650px){.video{grid-template-columns:1fr}.thumb{width:100%}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding-top:38px}}</style></head><body><header><div class="wrap nav"><div class="brand">AI TUBE<small>MY CHANNELS • CREATOR COMMAND CENTER</small></div><div class="actions"><a class="btn" href="./">← Dashboard</a><button class="btn" onclick="load()">↻ Refresh</button></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Owned channel analytics</div><h1>My Channels.</h1><p>Your YouTube portfolio, powered by the same server-side GitHub Actions snapshot. No API key is exposed to the browser.</p><div class="status"><span id="health" class="warn">● Loading…</span><span id="updated" class="meta">—</span></div></section><section class="section"><div id="channels" class="grid"></div></section><section class="section"><div class="eyebrow">Recent performance radar</div><h2>Top recent videos</h2><div id="videos" class="grid"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=n=>n==null?'—':(n=Number(n),n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n));const age=h=>h<1?Math.round(h*60)+'m':h<24?Math.round(h)+'h':Math.round(h/24)+'d';async function load(){let h=document.getElementById('health');h.textContent='● Loading latest snapshot…';try{let r=await fetch('data/my-channels.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('my-channels.json unavailable');let d=await r.json();let cs=d.channels||[];document.getElementById('channels').innerHTML=cs.length?cs.map((c,i)=>'<article class="card"><div class="channel"><img class="avatar" src="'+esc(c.thumbnail||'')+'" loading="lazy" alt=""><div><div class="eyebrow">OWN CHANNEL 0'+(i+1)+'</div><h2>'+esc(c.title)+'</h2><div class="handle">'+esc(c.handle)+'</div></div></div><div class="stats"><div class="stat"><div class="num">'+fmt(c.subscribers)+'</div><div class="label">SUBSCRIBERS</div></div><div class="stat"><div class="num">'+fmt(c.views)+'</div><div class="label">TOTAL VIEWS</div></div><div class="stat"><div class="num">'+fmt(c.videos)+'</div><div class="label">VIDEOS</div></div></div></article>').join(''):'<div class="empty">Waiting for the YouTube Intelligence workflow to produce the first live snapshot.</div>';let vs=cs.flatMap(c=>(c.recentVideos||[]).map(v=>({...v,owner:c.title}))).sort((a,b)=>(b.breakoutScore||0)-(a.breakoutScore||0)).slice(0,20);document.getElementById('videos').innerHTML=vs.length?vs.map((v,i)=>'<article class="card video"><img class="thumb" src="'+esc(v.thumbnail||'')+'" loading="lazy" alt=""><div><div class="eyebrow">#'+(i+1)+' • '+age(v.ageHours||0)+' old</div><h3>'+esc(v.title)+'</h3><div class="meta">'+esc(v.owner)+' • '+fmt(v.views)+' views • '+fmt(v.viewsPerHour)+' views/hour</div><span class="pill">Breakout '+esc(v.breakoutScore)+'</span><span class="pill">ER '+esc(v.engagementRate)+'%</span></div></article>').join(''):'<div class="empty">No owned-channel videos are available yet.</div>';h.textContent=d.status==='live'?'● LIVE SNAPSHOT LOADED':'● Snapshot waiting';h.className=d.status==='live'?'ok':'warn';document.getElementById('updated').textContent=d.updatedAt?'Updated '+new Date(d.updatedAt).toLocaleString():'Not updated yet'}catch(e){h.textContent='● '+e.message;h.className='warn';document.getElementById('updated').textContent='Check GitHub Actions and YOUTUBE_API_KEY'} }load();setInterval(load,300000);</script></body></html>
