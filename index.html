<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Tube — YouTube Intelligence</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#07080b;color:#f5f7fa}header{padding:28px 5vw;border-bottom:1px solid #20242b;position:sticky;top:0;background:#07080bf2;backdrop-filter:blur(18px);z-index:5}h1{margin:0;font-size:clamp(28px,4vw,48px)}p{color:#9da5b1}.wrap{max-width:1400px;margin:auto;padding:32px 5vw}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,button,select{background:#11141a;color:#fff;border:1px solid #2b3039;border-radius:12px;padding:12px 14px;font:inherit}input{flex:1;min-width:220px}button{cursor:pointer}.primary{background:#fff;color:#000}.status{font-size:13px;color:#8d96a3}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.card{border:1px solid #242932;background:#0e1116;border-radius:20px;padding:20px;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#505865}.top{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#20242b}.handle{color:#8e98a5;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:#151920;border-radius:12px;padding:10px}.num{font-weight:700}.label{font-size:11px;color:#818a98}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#191e26;color:#c8ced7}.empty{text-align:center;padding:80px 20px;border:1px dashed #303640;border-radius:20px;color:#8e98a5}.error{color:#ff9b9b}
</style></head><body>
<header><div class="wrap" style="padding:0"><div class="status">AI TUBE / USTECH</div><h1>YouTube Intelligence</h1><p>Live English creator research for AI, business, productivity and creator-economy channels.</p></div></header>
<main class="wrap">
<div class="toolbar"><input id="key" type="password" placeholder="YouTube Data API key (kept in browser only)"><button class="primary" onclick="saveKey()">Save key</button><button onclick="loadChannels()">Refresh live data</button><select id="sort" onchange="render()"><option value="subs">Subscribers</option><option value="views">Views</option><option value="name">Name</option></select></div>
<div id="status" class="status">Add your YouTube Data API v3 key to load live statistics.</div>
<div id="grid" class="grid" style="margin-top:18px"></div>
</main>
<script>
const CHANNELS=['@danmartell','@AlexHormozi','@aliabdaal','@DanKoeTalks','@GregIsenberg','@mreflow','@MyFirstMillionPod','@starterstory','@SimonSinek','@codiesanchez','@JustinWelsh','@thefutur','@robertoblake','@ThinkMediaTV','@JeffSu','@ThomasFrank','@matt_gray_','@LiamOttley','@zainkahn','@ruben.hassid'];
const FALLBACK=CHANNELS.map(h=>({title:h,handle:h,description:'English creator reference channel',subscriberCount:null,viewCount:null,videoCount:null,thumb:''}));
let data=[...FALLBACK];
function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(n){if(n==null)return '—';n=Number(n);return n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toLocaleString()}
function saveKey(){localStorage.setItem('yt_api_key',key.value.trim());loadChannels()}
async function loadChannels(){const k=localStorage.getItem('yt_api_key')||key.value.trim();if(!k){render();return}localStorage.setItem('yt_api_key',k);status.textContent='Resolving channels and fetching live statistics…';status.className='status';try{const q=await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&forHandle='+encodeURIComponent(CHANNELS.join(','))+'&key='+encodeURIComponent(k));if(!q.ok)throw Error('YouTube API returned '+q.status);const j=await q.json();const byHandle=new Map((j.items||[]).map(x=>['@'+x.snippet.customUrl?.replace(/^@/,'').toLowerCase(),x]));data=CHANNELS.map(h=>{const x=byHandle.get(h.toLowerCase());return x?{title:x.snippet.title,handle:'@'+(x.snippet.customUrl||h).replace(/^@/,''),description:x.snippet.description,subscriberCount:x.statistics.subscriberCount,viewCount:x.statistics.viewCount,videoCount:x.statistics.videoCount,thumb:x.snippet.thumbnails?.medium?.url}:FALLBACK.find(a=>a.handle===h)});status.textContent='Live data loaded from YouTube Data API.';render()}catch(e){status.textContent='Live data failed: '+e.message+'. Check the key, API quota and enabled YouTube Data API v3.';status.className='status error';render()}}
function render(){let a=[...data],s=sort.value;a.sort((x,y)=>s==='name'?x.title.localeCompare(y.title):Number(y[s==='subs'?'subscriberCount':'viewCount']||0)-Number(x[s==='subs'?'subscriberCount':'viewCount']||0));grid.innerHTML=a.map((x,i)=>`<article class="card"><div class="top"><img class="avatar" src="${esc(x.thumb||'')}" onerror="this.style.display='none'"><div><h2 style="margin:0;font-size:18px">${esc(x.title)}</h2><div class="handle">${esc(x.handle)}</div></div></div><div class="stats"><div class="stat"><div class="num">${fmt(x.subscriberCount)}</div><div class="label">SUBSCRIBERS</div></div><div class="stat"><div class="num">${fmt(x.viewCount)}</div><div class="label">TOTAL VIEWS</div></div><div class="stat"><div class="num">${fmt(x.videoCount)}</div><div class="label">VIDEOS</div></div></div><div class="tags"><span class="tag">AI</span><span class="tag">Business</span><span class="tag">Productivity</span><span class="tag">Creator Economy</span></div><p style="font-size:12px;line-height:1.5">${esc((x.description||'').slice(0,180))}</p></article>`).join('')}
render();
</script></body></html>
