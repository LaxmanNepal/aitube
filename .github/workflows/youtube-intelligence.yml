name: Update YouTube Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/youtube-intelligence.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate YouTube API configuration
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo 'ERROR: YOUTUBE_API_KEY is missing from repository Actions secrets.'; exit 1; fi
          echo 'YouTube API secret is available.'
      - name: Fetch channel and video intelligence
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, statistics, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone
          CHANNELS={"us":["@danmartell","@AlexHormozi","@aliabdaal","@DanKoeTalks","@GregIsenberg","@mreflow","@MyFirstMillionPod","@starterstory","@SimonSinek","@codiesanchez","@JustinWelsh","@thefutur","@robertoblake","@ThinkMediaTV","@JeffSu","@ThomasFrank","@matt_gray_","@LiamOttley","@zainkahn","@ruben.hassid"],"nepali":["@TechPana","@GadgetByteNepal","@TechLekh","@OnlineKhabar","@laxmannepalofficial"]}
          KEY=os.environ["YOUTUBE_API_KEY"]
          def api(resource,params):
            url='https://www.googleapis.com/youtube/v3/'+resource+'?'+urllib.parse.urlencode({**params,'key':KEY})
            try:
              with urllib.request.urlopen(url,timeout=30) as r:return json.load(r)
            except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace');print('YouTube API ERROR',e.code,body[:1500]);raise
          def dt(x):return datetime.fromisoformat(x.replace('Z','+00:00'))
          def score(v,h,b):
            vel=v/max(h,1/60);ratio=vel/max(b,1);recent=max(0,1-h/168)
            return round(min(100,50*min(ratio/5,1)+35*recent+15*min(v/max(b*24,1),1)),1)
          stamp=datetime.now(timezone.utc).isoformat(); co={"updatedAt":stamp,"status":"live","markets":{"us":[],"nepali":[]}}; vo={"updatedAt":stamp,"status":"live","markets":{"us":[],"nepali":[]},"summary":{"us":{},"nepali":{}}}
          now=datetime.now(timezone.utc)
          for market,handles in CHANNELS.items():
            allv=[]
            for handle in handles:
              d=api('channels',{'part':'snippet,statistics,contentDetails','forHandle':handle}); items=d.get('items',[])
              if not items: co['markets'][market].append({'handle':handle,'error':'channel_not_found'}); continue
              ch=items[0]; sn=ch.get('snippet',{}); st=ch.get('statistics',{}); uploads=ch.get('contentDetails',{}).get('relatedPlaylists',{}).get('uploads')
              co['markets'][market].append({'id':ch.get('id'),'handle':handle,'title':sn.get('title'),'description':sn.get('description',''),'thumbnail':sn.get('thumbnails',{}).get('high',{}).get('url'),'publishedAt':sn.get('publishedAt'),'uploadsPlaylist':uploads,'subscribers':int(st.get('subscriberCount',0)),'views':int(st.get('viewCount',0)),'videos':int(st.get('videoCount',0))})
              if not uploads:continue
              pl=api('playlistItems',{'part':'snippet,contentDetails','playlistId':uploads,'maxResults':10}); ids=[x.get('contentDetails',{}).get('videoId') for x in pl.get('items',[]) if x.get('contentDetails',{}).get('videoId')]
              if not ids:continue
              vd=api('videos',{'part':'snippet,statistics,contentDetails','id':','.join(ids)}); rows=[]
              for v in vd.get('items',[]):
                s=v.get('snippet',{}); z=v.get('statistics',{}); c=v.get('contentDetails',{}); pub=s.get('publishedAt')
                if not pub:continue
                h=max((now-dt(pub)).total_seconds()/3600,1/60); views=int(z.get('viewCount',0)); likes=int(z.get('likeCount',0)); comments=int(z.get('commentCount',0))
                rows.append({'id':v.get('id'),'channelId':ch.get('id'),'channel':sn.get('title'),'handle':handle,'title':s.get('title'),'description':s.get('description',''),'thumbnail':s.get('thumbnails',{}).get('high',{}).get('url'),'publishedAt':pub,'duration':c.get('duration'),'views':views,'likes':likes,'comments':comments,'ageHours':round(h,2)})
              baseline=statistics.median([r['views']/max(r['ageHours'],1/60) for r in rows[1:]]) if len(rows)>1 else 1
              for r in rows:r['viewsPerHour']=round(r['views']/max(r['ageHours'],1/60),1);r['engagementRate']=round((r['likes']+r['comments'])/max(r['views'],1)*100,3);r['breakoutScore']=score(r['views'],r['ageHours'],baseline)
              allv.extend(rows)
            allv.sort(key=lambda x:(x.get('breakoutScore',0),x.get('viewsPerHour',0)),reverse=True)
            for i,v in enumerate(allv):v['rank']=i+1
            vo['markets'][market]=allv
            counts={};stop={'the','and','for','with','this','that','you','your','from','are','how','what','why','into','about','new','best','to','a','of','in','on','is','my','it','ai'}
            for v in allv:
              for w in re.findall(r'[A-Za-z][A-Za-z0-9+#-]{2,}',v.get('title','').lower()):
                if w not in stop:counts[w]=counts.get(w,0)+1
            top=sorted(counts.items(),key=lambda x:(x[1],x[0]),reverse=True)[:15]
            vo['summary'][market]={'videosScanned':len(allv),'breakouts':sum(v.get('breakoutScore',0)>=70 for v in allv),'topVideo':allv[0] if allv else None,'topTopics':[{'topic':k,'mentions':n} for k,n in top]}
          with open('data/channels.json','w',encoding='utf-8') as f:json.dump(co,f,ensure_ascii=False,indent=2)
          with open('data/videos.json','w',encoding='utf-8') as f:json.dump(vo,f,ensure_ascii=False,indent=2)
          print('LIVE SNAPSHOT:',stamp)
          PY
      - name: Commit intelligence snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/channels.json data/videos.json
          git diff --cached --quiet || git commit -m 'chore: update channel and video intelligence'
          git push
